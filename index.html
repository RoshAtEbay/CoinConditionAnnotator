<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coin Condition Annotator</title>
  <style>
    /* ── tokens ── */
    :root {
      --bg: #f6f4ef; --card: #fff; --ink: #1c1b19; --muted: #5c574e;
      --line: #d9d2c5; --accent: #0b5fff; --err: #a1281d; --ok: #0d7a3e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--ink); line-height: 1.5;
      background: radial-gradient(circle at top left, #fff8e8, transparent 40%),
                  linear-gradient(180deg, #efeae1, var(--bg));
      min-height: 100vh;
    }

    /* ── progress bar ── */
    #progress-bar { height: 4px; background: var(--line); position: sticky; top: 0; z-index: 20; }
    #progress-fill { height: 100%; background: var(--accent); width: 0; transition: width .4s; }

    /* ── screens ── */
    .screen { display: none; }
    .screen.active { display: block; }

    /* ── centered card (setup + done) ── */
    .center-wrap {
      display: flex; align-items: center; justify-content: center;
      min-height: calc(100vh - 4px); padding: 24px;
    }
    .center-card {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 40px; max-width: 500px; width: 100%;
      box-shadow: 0 8px 32px rgba(28,27,25,.07);
    }
    .center-card h1 { font-size: 1.5rem; margin-bottom: 6px; }
    .center-card .sub { color: var(--muted); margin-bottom: 28px; font-size: .95rem; }

    /* ── form elements ── */
    label.field-label { display: block; font-size: .88rem; color: var(--muted); margin-bottom: 5px; }
    input[type=text], input[type=url] {
      width: 100%; padding: 10px 14px; border: 1px solid var(--line);
      border-radius: 8px; font-size: 1rem; font-family: inherit;
      outline: none; margin-bottom: 16px; transition: border .15s;
    }
    input:focus { border-color: var(--accent); }

    .btn {
      display: block; width: 100%; padding: 13px; border: none;
      border-radius: 10px; font-size: 1rem; font-weight: 600;
      font-family: inherit; cursor: pointer; transition: opacity .15s; text-align: center;
      text-decoration: none;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--accent); color: #fff; margin-bottom: 10px; }
    .btn-secondary { background: transparent; border: 1px solid var(--line); color: var(--ink); font-weight: 400; margin-bottom: 10px; }

    /* ── alert ── */
    .alert {
      padding: 10px 14px; border-radius: 8px; font-size: .9rem; margin-bottom: 16px;
    }
    .alert-err  { background: #fdf0ef; border: 1px solid #f5c5c0; color: var(--err); }
    .alert-warn { background: #fffbe6; border: 1px solid #ffe58f; color: #7d5a00; }

    /* ── annotate screen ── */
    #screen-annotate main {
      max-width: 900px; margin: 0 auto; padding: 20px 16px 80px;
    }
    .top-bar {
      display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px;
    }
    .top-bar h2 { font-size: 1.05rem; }
    .top-bar .counts { color: var(--muted); font-size: .88rem; }

    /* ── coin card ── */
    .coin-card, .form-card {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 20px; margin-bottom: 18px; box-shadow: 0 4px 20px rgba(28,27,25,.05);
    }
    .coin-meta { display: flex; gap: 10px 24px; flex-wrap: wrap; color: var(--muted); font-size: .88rem; margin-bottom: 14px; }
    .coin-meta a { color: var(--accent); }

    /* ── gallery ── */
    .gallery { display: flex; flex-wrap: wrap; gap: 10px; }
    .gallery img {
      height: 170px; width: auto; max-width: 230px;
      object-fit: contain; border: 1px solid var(--line); border-radius: 8px;
      background: #f0ece4; cursor: zoom-in; transition: transform .15s;
    }
    .gallery img:hover { transform: scale(1.04); }
    .no-images { color: var(--muted); font-size: .9rem; }

    /* ── condition radio buttons ── */
    .form-card h3 { font-size: .95rem; margin-bottom: 12px; }
    .buckets { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .bucket-opt {
      display: flex; align-items: center; gap: 10px; padding: 12px 16px;
      border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
      font-size: .95rem; transition: border-color .12s, background .12s;
    }
    .bucket-opt:hover { background: #f7f4ee; border-color: #b0a898; }
    .bucket-opt.selected { border-color: var(--accent); background: #eef3ff; }
    .bucket-opt.last { border-style: dashed; }
    .bucket-opt input { accent-color: var(--accent); width: 18px; height: 18px; cursor: pointer; }

    /* ── damaged checkbox ── */
    .damaged-row {
      display: flex; align-items: center; gap: 12px; padding: 14px 16px;
      border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
      margin-bottom: 22px; transition: background .12s;
    }
    .damaged-row:hover { background: #f7f4ee; }
    .damaged-row input { accent-color: var(--err); width: 20px; height: 20px; cursor: pointer; }
    .damaged-desc .label { font-size: .95rem; }
    .damaged-desc .hint { font-size: .82rem; color: var(--muted); }

    /* ── submit row ── */
    .submit-row { display: flex; gap: 10px; }
    .submit-row .btn-primary { flex: 1; }
    .submit-row .btn-skip {
      flex: 0 0 auto; padding: 13px 22px; background: transparent;
      border: 1px solid var(--line); color: var(--muted);
      border-radius: 10px; font-size: 1rem; cursor: pointer; font-family: inherit;
      font-weight: 400; transition: background .12s;
    }
    .submit-row .btn-skip:hover { background: #f7f4ee; }

    /* ── modal ── */
    #modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.93);
      z-index: 1000; align-items: center; justify-content: center; cursor: zoom-out;
    }
    #modal.open { display: flex; }
    #modal img { max-width: 95vw; max-height: 95vh; object-fit: contain; border-radius: 4px; }

    /* ── loading spinner ── */
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid #fff;
      border-top-color: transparent; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- Progress bar (shown during annotation) -->
<div id="progress-bar"><div id="progress-fill"></div></div>

<!-- ══════════════════════════════════════════════════════
     SCREEN 1 — SETUP
══════════════════════════════════════════════════════ -->
<div id="screen-setup" class="screen active">
  <div class="center-wrap">
    <div class="center-card">
      <h1>Coin Condition Annotator</h1>
      <p class="sub">Paste the Google Sheet link and enter your name to begin.</p>

      <div id="setup-error" class="alert alert-err" style="display:none"></div>

      <label class="field-label" for="sheet-url">Google Sheet URL</label>
      <input type="url" id="sheet-url" placeholder="https://docs.google.com/spreadsheets/d/...">

      <label class="field-label" for="annotator-name">Your name</label>
      <input type="text" id="annotator-name" placeholder="e.g. Kyle">

      <button class="btn btn-primary" onclick="startSession()">
        Sign in with Google &amp; start &rarr;
      </button>

      <p style="font-size:.82rem;color:var(--muted);text-align:center">
        You'll be asked to sign in to your eBay Google account.<br>
        Only the sheet you provide will be accessed.
      </p>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════
     SCREEN 2 — ANNOTATE
══════════════════════════════════════════════════════ -->
<div id="screen-annotate" class="screen">
  <main>
    <div class="top-bar">
      <h2 id="item-counter">Item — / —</h2>
      <span id="item-counts" class="counts"></span>
    </div>

    <div id="annotate-error" class="alert alert-err" style="display:none"></div>

    <!-- images -->
    <div class="coin-card">
      <div class="coin-meta" id="coin-meta"></div>
      <div class="gallery" id="gallery"><p class="no-images">Loading images…</p></div>
    </div>

    <!-- annotation form -->
    <div class="form-card">
      <h3>Condition</h3>

      <div class="buckets" id="buckets"></div>

      <label class="damaged-row" for="damaged-cb">
        <input type="checkbox" id="damaged-cb">
        <div class="damaged-desc">
          <div class="label">Cleaned / Damaged / Problem Coin</div>
          <div class="hint">Check if coin shows cleaning, damage, or other issues</div>
        </div>
      </label>

      <div class="submit-row">
        <button class="btn btn-primary" onclick="submitAnnotation(false)" id="save-btn">
          Save &amp; next &rarr;
        </button>
        <button class="btn-skip" onclick="submitAnnotation(true)">Skip</button>
      </div>
    </div>
  </main>
</div>

<!-- ══════════════════════════════════════════════════════
     SCREEN 3 — DONE
══════════════════════════════════════════════════════ -->
<div id="screen-done" class="screen">
  <div class="center-wrap">
    <div class="center-card" style="text-align:center">
      <h1>All done!</h1>
      <p class="sub" id="done-msg">Annotations saved to the Google Sheet.</p>
      <a id="sheet-link" href="#" target="_blank" rel="noopener" class="btn btn-primary" style="margin-bottom:10px">
        Open original sheet &rarr;
      </a>
      <button class="btn btn-secondary" onclick="showScreen('setup')">
        Start a new sheet
      </button>
    </div>
  </div>
</div>

<!-- Full-res image modal -->
<div id="modal" onclick="closeModal()">
  <img id="modal-img" src="" alt="">
</div>

<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async></script>

<script>
/* ═══════════════════════════════════════════════════════════
   CONFIG — fill these in after setting up Google Cloud
   See README for how to get these values.
═══════════════════════════════════════════════════════════ */
const CONFIG = {
  clientId: '',   // OAuth 2.0 Client ID (Web application)
  apiKey:   '',   // API key restricted to Sheets API (read-only key for initial load)
};

const BUCKETS = [
  "Below Fine",
  "Fine to Very Fine",
  "Extra Fine to AU",
  "Uncirculated",
  "Cannot determine from image",
];

const ANNOTATION_COLS = ["BU_CONDITION", "BU_DAMAGED", "BU_ANNOTATOR", "BU_ANNOTATED_AT"];
const IMAGE_COLS = [
  "picture_url","picture_url_2","picture_url_3","picture_url_4",
  "image_url","image_url_2","image_url_3","image_url_4",
];

/* ═══════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════ */
const S = {
  token:      null,
  sheetId:    '',
  annotator:  '',
  items:      [],   // [{rowIndex, itemId, itemUrl, images, sellerCondition, buCondition}]
  colMap:     {},   // header -> 0-based col index
  currentIdx: 0,
};

/* ═══════════════════════════════════════════════════════════
   AUTH
═══════════════════════════════════════════════════════════ */
function requestToken(callback) {
  if (!CONFIG.clientId) {
    showError('setup-error', 'CLIENT_ID not configured. See README.');
    return;
  }
  const client = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.clientId,
    scope: 'https://www.googleapis.com/auth/spreadsheets',
    callback: (resp) => {
      if (resp.error) { showError('setup-error', `Auth error: ${resp.error}`); return; }
      S.token = resp.access_token;
      callback();
    },
  });
  client.requestAccessToken({ prompt: '' });
}

/* ═══════════════════════════════════════════════════════════
   SHEETS API
═══════════════════════════════════════════════════════════ */
async function sheetsGet(sheetId, range) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${encodeURIComponent(range)}`;
  const resp = await fetch(url, { headers: { Authorization: `Bearer ${S.token}` } });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error?.message || `HTTP ${resp.status}`);
  }
  return resp.json();
}

async function sheetsPut(sheetId, range, values) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${encodeURIComponent(range)}?valueInputOption=RAW`;
  const resp = await fetch(url, {
    method: 'PUT',
    headers: { Authorization: `Bearer ${S.token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ values }),
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error?.message || `HTTP ${resp.status}`);
  }
}

async function sheetsAppendHeader(sheetId, colName) {
  // Append a new header column to row 1
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/1:1:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`;
  // Actually — simpler: just PUT to the next empty cell in row 1
  // We'll handle this in loadSheet
}

function colLetter(idx) {
  let s = '', n = idx + 1;
  while (n > 0) { s = String.fromCharCode(64 + (n % 26 || 26)) + s; n = Math.floor((n - 1) / 26); }
  return s;
}

async function withRetry(fn, retries = 3) {
  for (let i = 0; i < retries; i++) {
    try { return await fn(); }
    catch (err) {
      if (i === retries - 1) throw err;
      await new Promise(r => setTimeout(r, 1000 * (i + 1)));
    }
  }
}

/* ═══════════════════════════════════════════════════════════
   LOAD SHEET
═══════════════════════════════════════════════════════════ */
async function loadSheet() {
  const data = await withRetry(() => sheetsGet(S.sheetId, 'A:Z'));
  const rows = data.values || [];
  if (!rows.length) throw new Error('Sheet is empty.');

  const headers = rows[0].map(h => String(h).trim());
  S.colMap = {};
  headers.forEach((h, i) => { S.colMap[h] = i; });

  // Ensure BU annotation columns exist
  let changed = false;
  for (const col of ANNOTATION_COLS) {
    if (!(col in S.colMap)) {
      const nextIdx = headers.length;
      headers.push(col);
      S.colMap[col] = nextIdx;
      // Write header to sheet
      await withRetry(() => sheetsPut(S.sheetId, `${colLetter(nextIdx)}1`, [[col]]));
      changed = true;
    }
  }

  // Parse items
  S.items = rows.slice(1).map((row, i) => {
    const get = col => S.colMap[col] !== undefined ? (row[S.colMap[col]] || '') : '';
    const itemId = String(get('ITEM_ID')).trim();
    const itemUrl = get('item_url') || (itemId ? `https://www.ebay.com/itm/${itemId}` : '');
    const images = IMAGE_COLS.map(c => get(c)).filter(v => v && v !== 'None' && v !== 'null');
    return {
      rowIndex: i + 2,   // 1-indexed, row 1 is header
      itemId,
      itemUrl,
      images,
      sellerCondition: get('SELLER_CONDITION'),
      buCondition: String(get('BU_CONDITION')).trim(),
    };
  }).filter(item => item.itemId);
}

/* ═══════════════════════════════════════════════════════════
   WRITE ANNOTATION
═══════════════════════════════════════════════════════════ */
async function writeAnnotation(item, condition, damaged) {
  const ts = new Date().toISOString().replace('T', ' ').substring(0, 19) + ' UTC';
  const row = item.rowIndex;

  const buCondCol   = colLetter(S.colMap['BU_CONDITION']);
  const buDamagedCol = colLetter(S.colMap['BU_DAMAGED']);
  const buAnnotCol  = colLetter(S.colMap['BU_ANNOTATOR']);
  const buTsCol     = colLetter(S.colMap['BU_ANNOTATED_AT']);

  // Batch update — write all 4 cells in one request
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${S.sheetId}/values:batchUpdate`;
  const body = {
    valueInputOption: 'RAW',
    data: [
      { range: `${buCondCol}${row}`,    values: [[condition]] },
      { range: `${buDamagedCol}${row}`, values: [[damaged ? 'Yes' : '']] },
      { range: `${buAnnotCol}${row}`,   values: [[S.annotator]] },
      { range: `${buTsCol}${row}`,      values: [[ts]] },
    ],
  };
  const resp = await fetch(url, {
    method: 'POST',
    headers: { Authorization: `Bearer ${S.token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error?.message || `Write failed: HTTP ${resp.status}`);
  }
  // Update local state
  item.buCondition = condition;
}

/* ═══════════════════════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════════════════════ */
function nextUnannotated(afterIdx = -1) {
  for (let i = afterIdx + 1; i < S.items.length; i++) {
    if (!S.items[i].buCondition) return i;
  }
  return null;
}

function annotatedCount() {
  return S.items.filter(it => it.buCondition).length;
}

/* ═══════════════════════════════════════════════════════════
   UI HELPERS
═══════════════════════════════════════════════════════════ */
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(`screen-${name}`).classList.add('active');
  document.getElementById('progress-bar').style.display = name === 'annotate' ? 'block' : 'none';
}

function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = 'block';
}
function hideError(id) {
  document.getElementById(id).style.display = 'none';
}

function setSaveLoading(loading) {
  const btn = document.getElementById('save-btn');
  btn.disabled = loading;
  btn.innerHTML = loading ? '<span class="spinner"></span> Saving…' : 'Save &amp; next →';
}

function renderItem(idx) {
  const item  = S.items[idx];
  const total = S.items.length;
  const done  = annotatedCount();

  // Progress
  document.getElementById('progress-fill').style.width = `${(done / total * 100).toFixed(1)}%`;
  document.getElementById('item-counter').textContent = `Coin ${idx + 1} / ${total}`;
  document.getElementById('item-counts').textContent =
    `${done} done · ${total - done} remaining · ${S.annotator}`;

  // Meta
  const meta = document.getElementById('coin-meta');
  meta.innerHTML = item.itemId
    ? `<span>Item #${item.itemId}</span>${item.itemUrl ? `<a href="${item.itemUrl}" target="_blank" rel="noopener">View listing →</a>` : ''}`
    : '';

  // Gallery
  const gallery = document.getElementById('gallery');
  if (item.images.length) {
    gallery.innerHTML = item.images.map(url =>
      `<img src="${url}" alt="Coin image" loading="lazy" onclick="openModal('${url.replace(/'/g,"\\'")}'">`
    ).join('');
  } else {
    gallery.innerHTML = '<p class="no-images">No images found for this item.</p>';
  }

  // Condition buckets
  document.getElementById('buckets').innerHTML = BUCKETS.map((b, i) =>
    `<label class="bucket-opt${i === BUCKETS.length - 1 ? ' last' : ''}">
      <input type="radio" name="condition" value="${b}"
             onchange="document.querySelectorAll('.bucket-opt').forEach(l=>l.classList.remove('selected')); this.closest('.bucket-opt').classList.add('selected')">
      ${b}
    </label>`
  ).join('');

  // Reset damaged
  document.getElementById('damaged-cb').checked = false;
  hideError('annotate-error');
}

/* ═══════════════════════════════════════════════════════════
   ACTIONS
═══════════════════════════════════════════════════════════ */
async function startSession() {
  const sheetUrl  = document.getElementById('sheet-url').value.trim();
  const annotator = document.getElementById('annotator-name').value.trim();
  hideError('setup-error');

  if (!sheetUrl || !annotator) {
    showError('setup-error', 'Please fill in both fields.'); return;
  }

  let sheetId;
  try {
    const m = sheetUrl.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
    if (!m) throw new Error('Could not find a spreadsheet ID in that URL.');
    sheetId = m[1];
  } catch (e) {
    showError('setup-error', e.message); return;
  }

  if (!CONFIG.clientId) {
    showError('setup-error', 'CLIENT_ID not configured — see README.'); return;
  }

  S.sheetId   = sheetId;
  S.annotator = annotator;

  requestToken(async () => {
    try {
      await loadSheet();
    } catch (e) {
      showError('setup-error', `Could not load sheet: ${e.message}`); return;
    }

    const first = nextUnannotated();
    if (first === null) {
      showDone(); return;
    }
    S.currentIdx = first;
    showScreen('annotate');
    renderItem(first);
  });
}

async function submitAnnotation(skip) {
  hideError('annotate-error');

  if (!skip) {
    const condInput = document.querySelector('input[name="condition"]:checked');
    if (!condInput) {
      showError('annotate-error', 'Please select a condition before saving.'); return;
    }
    const condition = condInput.value;
    const damaged   = document.getElementById('damaged-cb').checked;

    setSaveLoading(true);
    try {
      await withRetry(() => writeAnnotation(S.items[S.currentIdx], condition, damaged));
    } catch (e) {
      setSaveLoading(false);
      showError('annotate-error', `Save failed — please try again. (${e.message})`);
      return;
    }
    setSaveLoading(false);
  }

  const next = nextUnannotated(S.currentIdx);
  if (next === null) {
    showDone(); return;
  }
  S.currentIdx = next;
  renderItem(next);
  window.scrollTo(0, 0);
}

function showDone() {
  const done  = annotatedCount();
  const total = S.items.length;
  document.getElementById('done-msg').textContent =
    `${done} of ${total} coins annotated. All saved to the Google Sheet.`;
  const link = document.getElementById('sheet-link');
  link.href = `https://docs.google.com/spreadsheets/d/${S.sheetId}`;
  showScreen('done');
}

/* ═══════════════════════════════════════════════════════════
   IMAGE MODAL
═══════════════════════════════════════════════════════════ */
function openModal(src) {
  document.getElementById('modal-img').src = src;
  document.getElementById('modal').classList.add('open');
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ── pre-fill sheet URL from query param (e.g. ?sheet=SHEET_ID) ── */
const urlParams = new URLSearchParams(window.location.search);
const preSheet = urlParams.get('sheet');
if (preSheet) {
  document.getElementById('sheet-url').value =
    `https://docs.google.com/spreadsheets/d/${preSheet}`;
}
</script>

</body>
</html>
